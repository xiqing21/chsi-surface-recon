# 沙箱最小配置
server.port=8443
server.ssl.enabled=false
cas.server.name=http://localhost:8443
cas.server.prefix=http://localhost:8443/cas

# 静态用户：沙箱账号
cas.authn.accept.users=sandbox::sandbox

# service registry：加载挂载目录下的 JSON
cas.service-registry.core.init-from-json=true
cas.service-registry.json.location=file:/etc/cas/services

# 关闭需要外部资源的特性
cas.authn.attribute-repository.core.attribute-name=
cas.monitor.endpoints.enabled=false
management.endpoints.web.exposure.include=health
